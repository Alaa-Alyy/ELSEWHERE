<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;width:1280px;height:640px;overflow:hidden}
  body{background:radial-gradient(circle at 85% 30%,#d9622b 0,#7a2e12 14%,transparent 34%),
       radial-gradient(circle at 12% 85%,#3a3f63 0,transparent 30%),
       linear-gradient(135deg,#05060f 0%,#14163a 100%);
       font-family:"Segoe UI",Arial,sans-serif;color:#f2efe9;display:flex;flex-direction:column;
       justify-content:center;padding:0 90px;box-sizing:border-box;position:relative}
  .stars{position:absolute;inset:0;background-image:
    radial-gradient(1.5px 1.5px at 10% 20%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 70%,#fff 50%,transparent 51%),
    radial-gradient(1.5px 1.5px at 55% 15%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 80%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 45% 45%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 90% 65%,#fff 50%,transparent 51%),
    radial-gradient(1px 1px at 20% 50%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 62% 58%,#fff 50%,transparent 51%);opacity:.8}
  .k{color:#f0a070;font-weight:600;letter-spacing:.12em;font-size:26px;position:relative}
  h1{font-size:110px;line-height:1;margin:16px 0 22px;font-weight:800;letter-spacing:.04em;position:relative}
  p{font-size:32px;color:#d7d3e6;margin:0 0 40px;max-width:900px;position:relative}
  .row{display:flex;gap:18px;position:relative}
  .chip{border:2px solid #d9622b;border-radius:40px;padding:10px 24px;font-size:24px}
</style></head><body>
  <div class="stars"></div>
  <div class="k">NASA SPACE APPS 2026</div>
  <h1>ELSEWHERE</h1>
  <p>Finding places on Earth whose terrain looks like the Moon and Mars.</p>
  <div class="row"><span class="chip">🌕 Moon</span><span class="chip">🔴 Mars</span><span class="chip">🌍 1.1M Earth windows</span><span class="chip">3D globes</span></div>
</body></html>
